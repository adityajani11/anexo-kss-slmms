# Nginx site config for slmms-v2.
# Copy to /etc/nginx/sites-available/slmms-v2, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Assumes the repo lives at /var/www/slmms-v2 and the API listens on the
# PORT set in server/.env (defaults to 5000 in server/index.js).

server {
    listen 80;
    server_name krishnaschoolgroupksd.in www.krishnaschoolgroupksd.in;

    root /var/www/slmms-v2/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        try_files $uri /index.html;
    }
}
