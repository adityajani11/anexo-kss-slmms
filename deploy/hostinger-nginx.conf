# Install as /etc/nginx/sites-available/slmms-api after replacing api.example.com.
# The Node process listens only on localhost:5000; Nginx provides HTTPS and the
# public API domain.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Match the backend's 500 MB multer limit. Reduce this if that is more than
    # your Hostinger plan can safely accept.
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
